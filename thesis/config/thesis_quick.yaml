# Smoke / CI profile — fast round-sweep + compare dry-run (minutes on CPU)

cipher: simon

input_delta: [0x0001, 0x0000]

n_samples_per_round: 5000
train_ratio: 0.7
val_ratio: 0.15

rounds: [3, 4, 5, 6, 7, 8, 9, 10]

seed: 1
data_dir: thesis/data/cache

model_dir: models/thesis
results_dir: results/thesis

training:
  epochs: 3
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  patience: 2
  device: auto

ciphers: [simon, speck]

classical:
  n_samples_speck: 50000
  n_samples_simon: 20000
  top_k_dp: 16
  monte_carlo_repetitions: 2
